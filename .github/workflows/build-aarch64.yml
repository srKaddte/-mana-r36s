name: Build Mana 0.8.0 AArch64 PortMaster

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - "port/**"
      - "scripts/**"
      - ".github/workflows/build-aarch64.yml"

permissions:
  contents: read

jobs:
  build-aarch64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build AArch64 PortMaster package
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ghcr.io/monkeyx-net/portmaster-build-templates/portmaster-builder:aarch64-latest \
            bash /workspace/scripts/build-aarch64.sh

      - name: Upload PortMaster artifact
        uses: actions/upload-artifact@v4
        with:
          name: mana-r36s-portmaster-aarch64
          path: dist/mana-r36s-portmaster-aarch64/**
          if-no-files-found: error
