name: Build Mana 0.8.0 AArch64 PortMaster

on:
  workflow_dispatch:

  push:
    paths:
      - "source/**"
      - "port/**"
      - "scripts/**"
      - ".github/workflows/build-aarch64.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Mana inside PortMaster AArch64 builder
        run: |
          docker run \
            --rm \
            --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ghcr.io/monkeyx-net/portmaster-build-templates/portmaster-builder:aarch64-latest \
            bash /workspace/scripts/build-aarch64.sh

      - name: Upload PortMaster ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mana-r36s-portmaster-aarch64
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload ELF diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: mana-elf-diagnostics
          path: dist/diagnostics.txt
          if-no-files-found: error
